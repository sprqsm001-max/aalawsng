name: Build AALAWSNG Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Web Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release Bundle (AAB for Google Play)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AALAWSNG-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AALAWSNG-GooglePlay-Bundle
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS Project Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Web Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor iOS & CocoaPods
        working-directory: frontend
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: Upload iOS Xcode Workspace
        uses: actions/upload-artifact@v4
        with:
          name: AALAWSNG-iOS-Xcode-Project
          path: frontend/ios/
