version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aalawsng_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aalawsng_user
      POSTGRES_PASSWORD: aalawsng_secure_password
      POSTGRES_DB: aalawsng_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aalawsng_user -d aalawsng_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aalawsng_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aalawsng_user:aalawsng_secure_password@postgres:5432/aalawsng_db
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_TRUST_ACCOUNT_ID: ${STRIPE_TRUST_ACCOUNT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aalawsng_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
